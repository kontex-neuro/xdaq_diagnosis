name: Build Executables

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: gather_xdaq_info-windows.exe
            output_name: gather_xdaq_info.exe
          - os: macos-latest
            artifact_name: gather_xdaq_info-macos
            output_name: gather_xdaq_info
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable with PyInstaller
      run: |
        pyinstaller --onefile --name gather_xdaq_info gather_xdaq_info.py
    
    # - name: Sign and Notarize (macOS)
    #   if: matrix.os == 'macos-latest'
    #   env:
    #     CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
    #     CERTIFICATE_PWD: ${{ secrets.CERTIFICATE_PWD }}
    #     KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
    #     APPLE_ID: ${{ secrets.APPLE_ID }}
    #     TEAM_ID: ${{ secrets.TEAM_ID }}
    #     APP_PWD: ${{ secrets.APP_PWD }}
    #   run: |
    #     echo $CERTIFICATE_BASE64 | base64 --decode > certificate.p12
    #     security create-keychain -p $KEYCHAIN_PWD build.keychain
    #     security default-keychain -s build.keychain
    #     security unlock-keychain -p $KEYCHAIN_PWD build.keychain
    #     security import certificate.p12 -k build.keychain -P $CERTIFICATE_PWD -T /usr/bin/codesign
    #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $KEYCHAIN_PWD build.keychain

    #     codesign --force --options runtime --deep --sign "$TEAM_ID" dist/gather_xdaq_info

    #     ditto -c -k --keepParent dist/gather_xdaq_info dist/gather_xdaq_info.zip

    #     xcrun notarytool store-credentials "kontex" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PWD"
    #     xcrun notarytool submit dist/gather_xdaq_info.zip --keychain-profile "kontex" --wait
    #     xcrun stapler staple dist/gather_xdaq_info
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.output_name }}
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}